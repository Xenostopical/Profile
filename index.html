        // Starfield (same visual treatment as the original boot screen).
        const canvas = document.getElementById('starfield');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let stars = [];
        let w = 0, h = 0;
        function resize() {
            if (!canvas || !ctx) return;
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            const count = Math.floor((w * h) / 2600);
            stars = Array.from({ length: count }, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.3 + 0.2,
                baseAlpha: Math.random() * 0.6 + 0.25,
                twinkleSpeed: Math.random() * 0.015 + 0.004,
                phase: Math.random() * Math.PI * 2,
                drift: Math.random() * 0.05 + 0.01
            }));
        }
        function tick(t) {
            if (!canvas || !ctx) return;
            ctx.clearRect(0, 0, w, h);
            for (const s of stars) {
                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed + s.phase) * 0.25;
                ctx.beginPath();
                ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, alpha))})`;
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                s.y += s.drift;
                if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
            }
            requestAnimationFrame(tick);
        }
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(tick);

        // ── Cursor tilt ──────────────────────────────────────────────────
        // The terminal window leans toward the cursor as it moves across the
        // screen, like it's looking at you. Runs regardless of the OS
        // reduce-motion setting (site owner's call) and is only skipped on
        // touch devices, which have no cursor to react to.
        const terminalWindow = document.getElementById('terminal-window');
        const hasHover = window.matchMedia('(hover: hover)').matches;
        if (terminalWindow && hasHover) {
            const MAX_TILT_DEG = 10;   // how far it leans at the edges of the screen
            const MAX_LIFT_PX = 6;     // subtle vertical parallax to sell the depth

            window.addEventListener('mousemove', (event) => {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                // Normalize cursor position to -1..1 relative to the viewport
                // center, rather than the window's own box, so the tilt reads
                // as "the whole screen is a window into the terminal" instead
                // of jittering as the mouse crosses the terminal's edges.
                const nx = (event.clientX / vw) * 2 - 1;
                const ny = (event.clientY / vh) * 2 - 1;

                const rotateY = nx * MAX_TILT_DEG;
                const rotateX = -ny * MAX_TILT_DEG;
                const translateY = ny * MAX_LIFT_PX;

                terminalWindow.style.transform =
                    `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(${translateY.toFixed(2)}px)`;
            }, { passive: true });

            window.addEventListener('mouseleave', () => {
                terminalWindow.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
            });
        }

// ── Terminal boot sequence ──────────────────────────────────────────────────

function typeLine(el, text, speed, onDone) {
  if (!text) { if (onDone) onDone(); return; }
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, i);
    if (i < text.length) {
      i++;
      // Slight per-character jitter so the typing doesn't feel mechanically even
      const jitter = speed + (Math.random() * speed * 0.6 - speed * 0.3);
      setTimeout(step, Math.max(4, jitter));
    } else if (onDone) {
      onDone();
    }
  })();
}

function runBootSequence(idx = 0) {
  if (!termBootLines) return;
  if (idx >= bootSequence.length) {
    setTimeout(revealAscii, 550);
    return;
  }
  const { text, cls, speed, delay } = bootSequence[idx];
  const lineEl = document.createElement('div');
  lineEl.className = 'term-line ' + cls;
  termBootLines.appendChild(lineEl);
  if (!text) {
    // blank spacer line — no typing, just a beat of silence
    if (termBody) termBody.scrollTop = termBody.scrollHeight;
    setTimeout(() => runBootSequence(idx + 1), delay);
    return;
  }
  typeLine(lineEl, text, speed, () => {
    if (termBody) termBody.scrollTop = termBody.scrollHeight;
    setTimeout(() => runBootSequence(idx + 1), delay);
  });
}

function revealAscii() {
  if (termAscii) {
    termAscii.style.display = 'block';
    termAscii.textContent   = ELITE_HUB_ASCII;
  }
  if (termBody) termBody.scrollTop = termBody.scrollHeight;
  setTimeout(revealQuote, 750);
}

function revealQuote() {
  if (termQuote) {
    termQuote.style.display = 'block';
    termQuote.textContent   = ELITE_HUB_QUOTE;
  }
  if (termBody) termBody.scrollTop = termBody.scrollHeight;
  setTimeout(revealContinue, 1000);
}

let termContinueBlinkVisible = true;
function revealContinue() {
  if (termContinue) {
    termContinue.style.display = 'block';
    setInterval(() => {
      termContinueBlinkVisible = !termContinueBlinkVisible;
      if (termContinueCur) termContinueCur.style.visibility = termContinueBlinkVisible ? 'visible' : 'hidden';
    }, 500);
  }
  if (termBody) termBody.scrollTop = termBody.scrollHeight;
}

setTimeout(() => runBootSequence(), 400);

        startScreen.addEventListener('touchstart', (event) => {
            event.preventDefault();
            continueFromBoot();
        }, { passive: false });
